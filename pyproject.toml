[build-system]
requires = ["setuptools >= 77"]
build-backend = "setuptools.build_meta"

[project]
name = "datalab-pulse-characterization"
version = "0.2.0"
description = "Analyze repeated pulse acquisitions: timing, stability, step response, delays and spectra"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["datalab-platform >= 1.3, < 2"]
keywords = ["datalab", "datalab-plugin", "pulse", "jitter", "step response"]

[project.urls]
Homepage = "https://github.com/DataLab-Platform/datalab-pulse-characterization"
Issues = "https://github.com/DataLab-Platform/datalab-pulse-characterization/issues"

[project.entry-points."datalab.plugins"]
datalab_pulse_characterization = "datalab_pulse_characterization.adapters.desktop:PulseTransientCharacterizationPlugin"

[project.entry-points."datalab.web_plugins"]
datalab_pulse_characterization = "datalab_pulse_characterization.adapters.web:PulseTransientCharacterizationWebPlugin"

[project.optional-dependencies]
test = ["build >= 1.2", "pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datalab_pulse_characterization = ["icons/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
