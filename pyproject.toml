[build-system]
requires = ["setuptools >= 77"]
build-backend = "setuptools.build_meta"

[project]
name = "datalab-pulse-characterization"
version = "0.1.0"
description = "Analyze repeated pulse acquisitions, timing and shot-to-shot stability"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["datalab-platform >= 1.3"]

[project.entry-points."datalab.plugins"]
datalab_pulse_characterization = "datalab_pulse_characterization.adapters.desktop:PulseTransientCharacterizationPlugin"

[project.optional-dependencies]
test = ["build >= 1.2", "pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
